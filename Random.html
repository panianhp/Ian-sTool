<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Team Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { text-align: center; color: #4a4e69; margin-bottom: 30px; font-weight: 800; }
        
        /* Layout for Inputs */
        .input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .input-section {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 300px;
        }
        
        h3 { 
            margin-top: 0; 
            color: #22223b; 
            border-bottom: 2px solid #f2f2f2; 
            padding-bottom: 10px;
            font-size: 1.1rem;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.5;
            box-sizing: border-box; 
            resize: vertical;
            font-family: monospace;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        button {
            padding: 15px 40px;
            background-color: #22223b;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 10;
        }
        
        button:active { transform: scale(0.98); }
        button:hover { background-color: #4a4e69; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* Result Grid */
        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .history-section {
            margin-top: 40px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-header h3 {
            margin: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .history-item {
            background: #fff;
            border: 1px solid #e9e9ef;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
        }

        .history-meta {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .history-item .results-container {
            margin-top: 0;
        }

        .group-card {
            background: white;
            border-radius: 12px;
            padding: 0;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .group-header {
            padding: 12px; /* Adjusted padding slightly */
            text-align: center;
            font-size: 1.25em; /* Reduced font size here */
            font-weight: bold;
            color: white;
            letter-spacing: 1px;
        }

        .group-card.a .group-header { background-color: #e63946; } /* Red */
        .group-card.b .group-header { background-color: #457b9d; } /* Blue */
        .group-card.c .group-header { background-color: #2a9d8f; } /* Green */

        .group-content { padding: 20px; }

        .sub-list-title {
            font-size: 0.75em;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            margin-top: 15px;
            border-bottom: 1px solid #eee;
            font-weight: bold;
        }
        .sub-list-title:first-child { margin-top: 0; }

        .member-list { list-style: none; padding: 0; margin: 0; }
        .member-list li { 
            padding: 8px 0; 
            font-size: 1.15em; 
            font-weight: 500;
            border-bottom: 1px dashed #f0f0f0;
        }
        .member-list li:last-child { border-bottom: none; }
        
        .total-count { 
            display: inline-block;
            margin-left: 8px;
            font-size: 0.7em; 
            font-weight: normal;
            opacity: 0.9; 
            vertical-align: middle;
        }

        /* --- Countdown Overlay --- */
        #countdown-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(34, 34, 59, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #countdown-number {
            font-size: 15rem;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            animation: pulse 1s infinite;
        }
        
        #countdown-text {
            font-size: 2rem;
            color: #ccc;
            margin-top: -20px;
            font-weight: 300;
        }

        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .idea-chip-panel {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #fff;
            border: 1px solid #ececf3;
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
        }

        .idea-chip-title {
            width: 100%;
            font-size: 12px;
            color: #666;
            margin-bottom: 2px;
        }

        .idea-chip {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: #eef2ff;
            color: #22223b;
            font-size: 13px;
            cursor: grab;
            user-select: none;
            border: 1px solid #dbe4ff;
        }

        .idea-chip:active { cursor: grabbing; }
        .chip-empty { font-size: 12px; color: #888; }

        .member-item[draggable="true"] { cursor: grab; }
        .member-item.dragging { opacity: 0.45; }

        .drop-zone {
            border: 1px dashed transparent;
            border-radius: 8px;
            padding: 6px;
            transition: 0.15s;
        }

        .drop-zone.drag-over {
            border-color: #7c9cff;
            background: #f4f7ff;
        }

        .idea-drop.drag-over {
            outline: 2px dashed rgba(255,255,255,0.85);
            outline-offset: -4px;
        }

        .empty-hint {
            color: #999;
            font-size: 0.95em;
            border-bottom: none !important;
        }

        .member-item.leader-pick {
            position: relative;
            padding-right: 28px;
        }

        .member-item.leader-pick::after {
            content: '👑';
            position: absolute;
            right: 0;
            top: 8px;
            font-size: 0.85em;
            opacity: 0.35;
        }

        .member-item.leader-pick:hover::after {
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <h1>🎲 Random Team Generator</h1>

    <div class="input-container">
        <div class="input-section">
            <h3>Main</h3>
            <textarea id="list1">Johnny Lin
Robin Chen
Stephen Huang
Ernest Chen
Galleta Hong
Corner Lin
Jim Kuo
Eric Hsu
Ho Kim
Ian Pan</textarea>
        </div>

        <div class="input-section">
            <h3>Support</h3>
            <textarea id="list2">Shaun Hu
Michelle Lee
Susan Chen
Jimmy Chang</textarea>
        </div>
        <div class="input-section">
            <h3>Idea Pool</h3>
            <textarea id="ideaPool">LP: Under OS comm 
AMT - Lite
Docking Debug
Low Battery</textarea>
        </div>
    </div>

    <div class="controls">
        <button id="startBtn" onclick="startCountdown()">🚀 Start Grouping</button>
        <button id="assignIdeaBtn" onclick="assignIdeasOnly()">💡 Arrange Idea</button>
    </div>

    <div id="ideaChips" class="idea-chip-panel">
        <div class="idea-chip-title">Drag idea chip to Team header to set idea</div>
    </div>

    <div id="resultsArea" class="results-container">
        </div>

    <div class="history-section">
        <div class="history-header">
            <h3>Grouping History</h3>
            <button onclick="clearHistory()" style="padding:8px 16px;font-size:14px;">Clear History</button>
        </div>
        <div id="historyArea" class="history-list"></div>
    </div>

    <div id="countdown-overlay">
        <div id="countdown-number">5</div>
        <div id="countdown-text">Shuffling...</div>
    </div>

    <script>
        const HISTORY_STORAGE_KEY = 'random-team-history-v1';
        const MAX_HISTORY_ITEMS = 3;
        const GROUP_KEYS = ['A', 'B', 'C'];
        let currentGroups = null;

        function cloneGroups(obj) {
            return JSON.parse(JSON.stringify(obj));
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[s]));
        }

        // Start the countdown sequence
        function startCountdown() {
            const rawList1 = document.getElementById('list1').value;
            const rawList2 = document.getElementById('list2').value;

            if (cleanInput(rawList1).length === 0 && cleanInput(rawList2).length === 0) {
                alert("Both lists are empty! Please enter some names.");
                return;
            }

            const rawIdeas = document.getElementById('ideaPool').value;
            if (cleanInput(rawIdeas).length === 0) {
                alert("Idea Pool is empty! Please enter some ideas.");
                return;
            }

            document.getElementById('resultsArea').innerHTML = '';
            currentGroups = null;

            const overlay = document.getElementById('countdown-overlay');
            const numberDisplay = document.getElementById('countdown-number');
            const btn = document.getElementById('startBtn');

            overlay.style.display = 'flex';
            btn.disabled = true;

            let count = 5;
            numberDisplay.textContent = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    numberDisplay.textContent = count;
                } else {
                    clearInterval(timer);
                    overlay.style.display = 'none';
                    btn.disabled = false;
                    distributeBoth();
                }
            }, 1000);
        }

        function distributeBoth() {
            const list1 = cleanInput(document.getElementById('list1').value);
            const list2 = cleanInput(document.getElementById('list2').value);

            shuffleArray(list1);
            shuffleArray(list2);

            const groups = {
                A: { list1: [], list2: [], leader: '', idea: '' },
                B: { list1: [], list2: [], leader: '', idea: '' },
                C: { list1: [], list2: [], leader: '', idea: '' }
            };

            list1.forEach((name, index) => {
                groups[getGroupKey(index)].list1.push(name);
            });

            const offset = Math.floor(Math.random() * 3);
            list2.forEach((name, index) => {
                groups[getGroupKey(index + offset)].list2.push(name);
            });

            const ideaList = cleanInput(document.getElementById('ideaPool').value);
            shuffleArray(ideaList);
            GROUP_KEYS.forEach((key, idx) => {
                groups[key].idea = ideaList.length > 0 ? ideaList[idx % ideaList.length] : '';
            });

            ensureLeaders(groups);
            renderGroups(groups, 'Regrouped');
        }

        function assignIdeasOnly() {
            const rawIdeas = document.getElementById('ideaPool').value;
            if (cleanInput(rawIdeas).length === 0) {
                alert("Idea Pool is empty! Please enter some ideas.");
                return;
            }

            if (!currentGroups) {
                alert("Please Group first before assigning ideas!");
                return;
            }

            const groups = cloneGroups(currentGroups);
            const ideaList = cleanInput(rawIdeas);
            const shuffled = [...ideaList];
            shuffleArray(shuffled);

            GROUP_KEYS.forEach((key, idx) => {
                groups[key].idea = shuffled.length > 0 ? shuffled[idx % shuffled.length] : '';
            });

            ensureLeaders(groups);
            renderGroups(groups, 'Ideas Re-assigned');
        }

        function ensureLeaders(groups) {
            GROUP_KEYS.forEach(key => {
                const mains = groups[key].list1 || [];
                if (!mains.length) {
                    groups[key].leader = '';
                    return;
                }
                if (!mains.includes(groups[key].leader)) {
                    groups[key].leader = mains[Math.floor(Math.random() * mains.length)];
                }
            });
        }

        function renderGroups(groups, actionLabel) {
            const container = document.getElementById('resultsArea');
            if (actionLabel) archiveCurrentResults(actionLabel);
            container.innerHTML = '';

            GROUP_KEYS.forEach(key => {
                const data = groups[key];
                const totalMembers = data.list1.length + data.list2.length;
                const leader = data.leader || '';

                const list1Html = (data.list1.length ? data.list1 : ['']).map(n =>
                    n
                        ? `<li class="member-item leader-pick" title="Click to set as leader" draggable="true" data-name="${escapeHtml(n)}" data-group="${key}" data-type="list1"${n === leader ? ' style="font-weight:bold;color:#FFD600;"' : ''}>${escapeHtml(n)}${n === leader ? ' ⭐' : ''}</li>`
                        : `<li class="empty-hint">Drop member here</li>`
                ).join('');

                const list2Html = (data.list2.length ? data.list2 : ['']).map(n =>
                    n
                        ? `<li class="member-item" draggable="true" data-name="${escapeHtml(n)}" data-group="${key}" data-type="list2">${escapeHtml(n)}</li>`
                        : `<li class="empty-hint">Drop member here</li>`
                ).join('');

                const card = document.createElement('div');
                card.className = `group-card ${key.toLowerCase()}`;
                card.innerHTML = `
                    <div class="group-header idea-drop" data-group="${key}">
                        Team ${key}
                        <span class="total-count">(${totalMembers})</span>
                        <div style="font-size:0.9em;margin-top:4px;">Leader: <span style="font-weight:bold;color:#FFD600;">${escapeHtml(leader || '-')}</span></div>
                        <div style="font-size:0.9em;margin-top:2px;">Idea: <span style="font-weight:bold;color:#FFD600;">${escapeHtml(data.idea || '-')}</span></div>
                    </div>
                    <div class="group-content">
                        <div class="drop-zone" data-group="${key}" data-type="list1">
                            <div class="sub-list-title">From Main</div>
                            <ul class="member-list">${list1Html}</ul>
                        </div>
                        <div style="height:12px"></div>
                        <div class="drop-zone" data-group="${key}" data-type="list2">
                            <div class="sub-list-title">From Support</div>
                            <ul class="member-list">${list2Html}</ul>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            currentGroups = cloneGroups(groups);
            bindDragDrop();
        }

        function bindDragDrop() {
            document.querySelectorAll('.member-item').forEach(el => {
                el.addEventListener('dragstart', e => {
                    el.classList.add('dragging');
                    const payload = {
                        kind: 'member',
                        name: el.dataset.name,
                        fromGroup: el.dataset.group,
                        fromType: el.dataset.type
                    };
                    e.dataTransfer.setData('text/plain', JSON.stringify(payload));
                });
                el.addEventListener('dragend', () => el.classList.remove('dragging'));
            });

            // 新增：點擊 Main 成員直接設 Leader
            document.querySelectorAll('.member-item[data-type="list1"]').forEach(el => {
                el.addEventListener('click', () => {
                    setLeaderByPick(el.dataset.group, el.dataset.name);
                });
            });

            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.addEventListener('dragover', e => {
                    e.preventDefault();
                    zone.classList.add('drag-over');
                });
                zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
                zone.addEventListener('drop', e => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');

                    const txt = e.dataTransfer.getData('text/plain');
                    if (!txt) return;
                    let payload = null;
                    try { payload = JSON.parse(txt); } catch { return; }
                    if (!payload || payload.kind !== 'member') return;

                    moveMemberByDrag(
                        payload.name,
                        payload.fromGroup,
                        payload.fromType,
                        zone.dataset.group,
                        zone.dataset.type
                    );
                });
            });

            document.querySelectorAll('.idea-drop').forEach(header => {
                header.addEventListener('dragover', e => {
                    e.preventDefault();
                    header.classList.add('drag-over');
                });
                header.addEventListener('dragleave', () => header.classList.remove('drag-over'));
                header.addEventListener('drop', e => {
                    e.preventDefault();
                    header.classList.remove('drag-over');

                    const txt = e.dataTransfer.getData('text/plain');
                    if (!txt) return;
                    let payload = null;
                    try { payload = JSON.parse(txt); } catch { return; }

                    if (payload?.kind === 'idea') {
                        applyIdeaByDrag(payload.idea, header.dataset.group);
                        return;
                    }

                    // 新增：把 Main 成員拖到 Team Header 設 Leader（跨組會先移動）
                    if (payload?.kind === 'member') {
                        setLeaderByDrop(payload, header.dataset.group);
                    }
                });
            });

            bindIdeaChipDrag();
        }

        function moveMemberByDrag(name, fromGroup, fromType, toGroup, toType) {
            if (!currentGroups || !name) return;
            if (fromGroup === toGroup && fromType === toType) return;

            const groups = cloneGroups(currentGroups);
            const src = groups[fromGroup]?.[fromType];
            const dst = groups[toGroup]?.[toType];
            if (!src || !dst) return;

            const idx = src.indexOf(name);
            if (idx < 0) return;

            src.splice(idx, 1);
            dst.push(name);

            if (fromType === 'list1' && groups[fromGroup].leader === name) {
                groups[fromGroup].leader = '';
            }

            ensureLeaders(groups);
            renderGroups(groups, 'Drag Member Adjusted');
        }

        function applyIdeaByDrag(idea, targetGroup) {
            if (!currentGroups || !targetGroup) return;
            const groups = cloneGroups(currentGroups);
            groups[targetGroup].idea = (idea || '').trim();
            ensureLeaders(groups);
            renderGroups(groups, 'Drag Idea Adjusted');
        }

        function renderIdeaChips() {
            const panel = document.getElementById('ideaChips');
            if (!panel) return;

            const ideas = cleanInput(document.getElementById('ideaPool').value);
            if (!ideas.length) {
                panel.innerHTML = `
                    <div class="idea-chip-title">Drag idea chip to Team header to set idea</div>
                    <span class="chip-empty">No ideas</span>
                `;
                return;
            }

            panel.innerHTML =
                `<div class="idea-chip-title">Drag idea chip to Team header to set idea</div>` +
                ideas.map(i => `<span class="idea-chip" draggable="true" data-idea="${escapeHtml(i)}">${escapeHtml(i)}</span>`).join('');

            bindIdeaChipDrag();
        }

        function bindIdeaChipDrag() {
            document.querySelectorAll('.idea-chip').forEach(chip => {
                chip.addEventListener('dragstart', e => {
                    const payload = { kind: 'idea', idea: chip.dataset.idea || chip.textContent || '' };
                    e.dataTransfer.setData('text/plain', JSON.stringify(payload));
                });
            });
        }

        function cleanInput(text) {
            return text.split('\n').map(n => n.trim()).filter(n => n !== '');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function getGroupKey(index) {
            const remainder = index % 3;
            if (remainder === 0) return 'A';
            if (remainder === 1) return 'B';
            return 'C';
        }

        function archiveCurrentResults(actionLabel) {
            const current = document.getElementById('resultsArea');
            const history = document.getElementById('historyArea');

            if (!current || !history || current.children.length === 0) return;

            const item = document.createElement('div');
            item.className = 'history-item';

            const meta = document.createElement('div');
            meta.className = 'history-meta';
            meta.textContent = `${actionLabel} at ${new Date().toLocaleString()}`;

            const snapshot = document.createElement('div');
            snapshot.className = 'results-container';
            snapshot.innerHTML = current.innerHTML;

            item.appendChild(meta);
            item.appendChild(snapshot);
            history.prepend(item);
            trimHistoryItems(history);
            saveHistoryToStorage();
        }

        function clearHistory() {
            document.getElementById('historyArea').innerHTML = '';
            localStorage.removeItem(HISTORY_STORAGE_KEY);
        }

        function saveHistoryToStorage() {
            const history = document.getElementById('historyArea');
            if (!history) return;
            localStorage.setItem(HISTORY_STORAGE_KEY, history.innerHTML);
        }

        function loadHistoryFromStorage() {
            const history = document.getElementById('historyArea');
            if (!history) return;

            const saved = localStorage.getItem(HISTORY_STORAGE_KEY);
            if (saved) {
                history.innerHTML = saved;
                trimHistoryItems(history);
                saveHistoryToStorage();
            }
        }

        function trimHistoryItems(historyContainer) {
            while (historyContainer.children.length > MAX_HISTORY_ITEMS) {
                historyContainer.removeChild(historyContainer.lastElementChild);
            }
        }

        document.getElementById('ideaPool').addEventListener('input', renderIdeaChips);

        loadHistoryFromStorage();
        renderIdeaChips();
    </script>
</body>
</html>
